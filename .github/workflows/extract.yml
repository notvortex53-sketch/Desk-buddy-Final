```yaml
name: Extract Desk Buddy ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to the ZIP file in the repository"
        required: true
        default: "DeskBuddy_Phase8_OpenRouter_GPTAudioMini_ClaudeSonnet46.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP exists
        run: |
          if [ ! -f "${{ inputs.zip_path }}" ]; then
            echo "ZIP file not found: ${{ inputs.zip_path }}"
            exit 1
          fi

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o "${{ inputs.zip_path }}" -d extracted

          # Copy the ZIP contents into the repository root.
          cp -a extracted/. .

          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Desk Buddy project ZIP"
            git push
          fi
```
