services:
  - type: web
    name: desk-buddy-gateway
    runtime: python
    plan: free
    rootDir: gateway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEVICE_TOKEN_PEPPER
        sync: false
      - key: DEVICE_AUTH_TIMEOUT_SECONDS
        value: 10
      - key: DEVICE_HEARTBEAT_SECONDS
        value: 25
      - key: WINDOWS_REAUTHENTICATION_SECONDS
        value: 3600
      - key: ANDROID_REAUTHENTICATION_SECONDS
        value: 3600
      - key: ETHICAL_MODE_REQUIRED
        value: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: CHAT_PROVIDER
        value: nvidia
      - key: ETHICAL_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: CHAT_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: ETHICAL_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      # Optional; only the current audio pipeline still uses OpenRouter.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: VOICE_MODEL
        value: openai/gpt-audio-mini
      - key: VOICE_NAME
        value: alloy
      - key: MODEL_TIMEOUT_SECONDS
        value: 60
